services:
  kafka:
    image: redpandadata/redpanda:v24.1.20
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=kafka:33145
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  kafka-setup:
    image: redpandadata/redpanda:v24.1.20
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! rpk topic list -X brokers=kafka:9092 | grep -q "^$${KAFKA_TOPIC}[[:space:]]"; then
          rpk topic create "$${KAFKA_TOPIC}" --partitions 3 --replicas 1 -X brokers=kafka:9092
        fi
    environment:
      KAFKA_TOPIC: transactions

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: fraud
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
      - ./sql/max_by_state.sql:/query.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  producer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro

volumes:
  redpanda_data:
  clickhouse_data:
